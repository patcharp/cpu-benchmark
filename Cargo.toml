[package]
name = "cpubench"
version = "0.1.0"
edition = "2024"
description = "Cross-architecture (x86_64 / aarch64) CPU benchmark with JSON/Markdown/HTML reports and A/B comparison"
build = "build.rs"

[dependencies]
aes = "0.9.3"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
